# nginx config for self-hosting Dang (e.g. behind a Cloudflare Tunnel).
# Mount as /etc/nginx/conf.d/default.conf in the nginx:alpine container.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  types {
    application/manifest+json webmanifest;
  }

  # Never serve repo internals.
  location ~ /\.(git|github) { deny all; }

  # Must always be fresh so updates and the service worker roll out promptly.
  location ~* (^/$|\.html$|/sw\.js$|\.webmanifest$) {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # App code: short cache; the service worker handles offline.
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=300";
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
