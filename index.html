<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1424">
<meta name="description" content="A cozy pixel match-3 set in a rainy cabin. Big matches only go off if you beat the storm at tic-tac-toe.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dang">
<title>Dang: Rainy Cabin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bgRain" aria-hidden="true"></canvas>
<div id="app">
  <header id="hud">
    <div class="res coin"><img data-icon="coin"><span id="coins">0</span></div>
    <div class="res shard"><img data-icon="shard"><span id="shards">0</span></div>
    <div class="res day"><img id="dayIcon" data-icon="sun"><span id="dayText">Day 1</span></div>
    <div class="hud-right">
      <button id="installBtn" class="chip" hidden>Install</button>
      <button id="soundBtn" class="chip" aria-label="Toggle sound"><img data-icon="sndOn"></button>
    </div>
  </header>

  <main>
    <section id="scr-create" class="screen"></section>

    <section id="scr-bedroom" class="screen">
      <div class="stage"><canvas id="bedroomCanvas" aria-label="Your bed, first thing in the morning"></canvas></div>
      <nav class="actions">
        <p class="tip center-tip" id="morningText">Day 1.</p>
        <button id="riseBtn" class="btn primary big" disabled>Rise and match!</button>
      </nav>
    </section>

    <section id="scr-cabin" class="screen">
      <div class="inv"></div>
      <div class="stage"><canvas id="cabinCanvas" aria-label="Your rainy cabin at night"></canvas></div>
      <nav class="actions night-actions">
        <div class="row">
          <button id="phoneBtn" class="btn"><img data-icon="phone"> Phone</button>
          <button id="upBtn" class="btn"><img data-icon="kit"> Upstairs</button>
        </div>
        <div class="row">
          <button id="decorBtn" class="btn"><img data-icon="lumber"> Decorate</button>
          <button id="wardBtn" class="btn"><img data-icon="shard"> Wardrobe</button>
        </div>
        <div class="row">
          <button id="arcadeBtn" class="btn" hidden><img data-icon="arcade"> Arcade</button>
          <button id="sleepBtn" class="btn primary big">Sleep <small id="sleepLabel">Day 2</small></button>
        </div>
      </nav>
    </section>

    <section id="scr-match" class="screen">
      <div class="match-hud">
        <div class="mh-row">
          <span id="mLevel" class="pill">Level 1</span>
          <span class="pill"><b id="mMoves">20</b>&nbsp;moves</span>
          <span id="mBlastPill" class="pill"><img data-icon="bolt">&nbsp;<b id="mBlasts">0/1</b></span>
        </div>
        <div class="bar"><div id="mBar"></div><span id="mScore"><span id="mScoreNum">0</span> / <span id="mScoreTarget">1000</span></span></div>
        <p id="mDay" class="tip small"></p>
      </div>
      <div class="stage board-stage">
        <canvas id="boardCanvas" aria-label="Puzzle board"></canvas>
        <div id="morph" class="morph" hidden></div>
      </div>
      <div class="match-foot">
        <button id="quitBtn" class="btn small">Home</button>
        <p class="tip" id="mTip"><b>Swap two charged tiles together</b> to play a mini-game.</p>
      </div>
    </section>

    <section id="scr-arcade" class="screen"></section>

    <section id="scr-farm" class="screen">
      <div class="inv"></div>
      <div class="stage"><canvas id="farmCanvas" aria-label="Attic farm"></canvas></div>
      <nav class="actions">
        <div class="wall-nav">
          <button id="wallPrev" class="btn small" aria-label="Turn left">◀</button>
          <p class="tip" id="wallLabel">North wall</p>
          <button id="wallNext" class="btn small" aria-label="Turn right">▶</button>
        </div>
        <div class="row">
          <button id="pantryBtn" class="btn"><img data-icon="boost_jam"> Pantry</button>
          <button id="downBtn" class="btn">Downstairs</button>
        </div>
      </nav>
    </section>
  </main>
</div>

<div id="modal" class="overlay" hidden></div>
<div id="interlude" class="interlude" hidden></div>
<div id="vn" class="vn" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="version" aria-hidden="true"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
